<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Intelligence Dashboard</h1>
    </header>
    <section>
        <h2>Current Statistics</h2>
        <div id="stats">
            <p>Total Users: 1000</p>
            <p>Active Sessions: 250</p>
            <p>Daily Active Users: 150</p>
            <p>Daily Transactions: 300</p>
        </div>
    </section>
    <section>
        <h2>Recent Activity</h2>
        <table>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Timestamp</th>
            </tr>
            <tr>
                <td>JaneDoe</td>
                <td>Logged In</td>
                <td>2026-04-08 12:30:00</td>
            </tr>
            <tr>
                <td>JohnSmith</td>
                <td>Made a Purchase</td>
                <td>2026-04-08 12:31:00</td>
            </tr>
            <!-- More rows can be added here -->
        </table>
    </section>
    <footer>
        <p>&copy; 2026 Intelligence Dashboard</p>
    </footer>
</body>
</html>
