<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FixBuddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .password-strength {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
    }

    .strength-weak {
      background: #f8d7da;
      color: #721c24;
    }

    .strength-fair {
      background: #fff3cd;
      color: #856404;
    }

    .strength-good {
      background: #d1ecf1;
      color: #0c5460;
    }

    .strength-strong {
      background: #d4edda;
      color: #155724;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .progress-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .progress-step {
      flex: 1;
      height: 4px;
      background: #ddd;
      margin: 0 5px;
      border-radius: 2px;
    }

    .progress-step.completed {
      background: #667eea;
    }

    .progress-step.active {
      background: #764ba2;
    }

    @media (max-width: 480px) {
      .card {
        border-radius: 5px;
      }

      .header {
        padding: 20px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>FixBuddy</h1>
        <p>Reset Your Password</p>
      </div>

      <div class="content">
        <!-- STEP 1: Validate Token & Show User Info -->
        <div class="step active" id="step1">
          <div class="progress-indicator">
            <div class="progress-step active"></div>
            <div class="progress-step"></div>
          </div>

          <div id="loadingStep1" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Validating reset link...</p>
          </div>

          <div id="step1Content">
            <div id="validationMessage"></div>
            <div id="userInfo" style="display: none;">
              <p style="text-align: center; color: #666; margin-bottom: 20px;">
                Ready to reset password for:
              </p>
              <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                <p style="text-align: center; margin: 5px 0;"><strong id="userEmail"></strong></p>
                <p style="text-align: center; color: #999; font-size: 12px; margin: 5px 0;" id="userName"></p>
              </div>
              <button class="btn" onclick="showStep2()">Continue</button>
            </div>
          </div>
        </div>

        <!-- STEP 2: Reset Password Form -->
        <div class="step" id="step2">
          <div class="progress-indicator">
            <div class="progress-step completed"></div>
            <div class="progress-step active"></div>
          </div>

          <div id="step2Content">
            <form id="resetPasswordForm" onsubmit="submitResetPassword(event)">
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input 
                  type="password" 
                  id="newPassword" 
                  placeholder="Enter your new password"
                  required
                  onchange="checkPasswordStrength()"
                  oninput="checkPasswordStrength()"
                >
                <div id="passwordStrength" class="password-strength" style="display: none;"></div>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                  type="password" 
                  id="confirmPassword" 
                  placeholder="Confirm your new password"
                  required
                >
              </div>

              <button type="submit" class="btn" id="submitBtn">Reset Password</button>
            </form>

            <div class="back-link">
              <a href="#" onclick="goBackToStep1(); return false;">← Back</a>
            </div>
          </div>

          <div id="loadingStep2" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Resetting password...</p>
          </div>
        </div>

        <!-- STEP 3: Success -->
        <div class="step" id="step3">
          <div style="text-align: center; padding: 20px;">
            <div style="font-size: 50px; margin-bottom: 20px;">✓</div>
            <h2 style="color: #155724; margin-bottom: 10px;">Password Reset Successful!</h2>
            <p style="color: #666; margin-bottom: 30px;">
              Your password has been updated. You can now login with your new password.
            </p>
            <a href="./UserLoginPage.html" class="btn">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/auth';
    const resetToken = getTokenFromURL();
    let currentStep = 1;
    let userEmail = '';
    let userName = '';

    // Get token from URL: /reset-password/TOKEN
    function getTokenFromURL() {
      const pathParts = window.location.pathname.split('/');
      return pathParts[pathParts.length - 1];
    }

    // Initialize - Validate token
    window.addEventListener('DOMContentLoaded', () => {
      validateToken();
    });

    // ✅ STEP 1: Validate Token
    async function validateToken() {
      const loadingDiv = document.getElementById('loadingStep1');
      const contentDiv = document.getElementById('step1Content');
      const messageDiv = document.getElementById('validationMessage');
      const userInfoDiv = document.getElementById('userInfo');

      loadingDiv.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}/reset-password/${resetToken}`);
        const data = await response.json();

        loadingDiv.style.display = 'none';

        if (!response.ok) {
          messageDiv.innerHTML = `
            <div class="message error">
              <strong>⚠️ Invalid or Expired Link</strong><br>
              ${data.message || 'This reset link is invalid or has expired.'}
            </div>
            <div style="text-align: center; margin-top: 20px;">
              <a href="./UserLoginPage.html" class="btn" style="text-decoration: none;">Back to Login</a>
            </div>
          `;
          return;
        }

        // Token is valid
        userEmail = data.data.email;
        userName = data.data.name;
        
        document.getElementById('userEmail').textContent = userEmail;
        document.getElementById('userName').textContent = `Hello, ${userName}`;
        userInfoDiv.style.display = 'block';

      } catch (error) {
        loadingDiv.style.display = 'none';
        messageDiv.innerHTML = `
          <div class="message error">
            <strong>Error</strong><br>
            ${error.message}
          </div>
        `;
      }
    }

    // Navigate to Step 2
    function showStep2() {
      currentStep = 2;
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    }

    // Go back to Step 1
    function goBackToStep1() {
      currentStep = 1;
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
    }

    // Check password strength
    function checkPasswordStrength() {
      const password = document.getElementById('newPassword').value;
      const strengthDiv = document.getElementById('passwordStrength');
      
      if (!password) {
        strengthDiv.style.display = 'none';
        return;
      }

      let strength = 'weak';
      let message = '❌ Weak password';
      let className = 'strength-weak';

      if (password.length >= 8 && /[a-z]/.test(password) && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[!@#$%^&*]/.test(password)) {
        strength = 'strong';
        message = '✓ Strong password';
        className = 'strength-strong';
      } else if (password.length >= 8 && /[a-z]/.test(password) && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
        strength = 'good';
        message = '✓ Good password';
        className = 'strength-good';
      } else if (password.length >= 6 && /[a-z]/.test(password) && /[A-Z]/.test(password)) {
        strength = 'fair';
        message = '~ Fair password';
        className = 'strength-fair';
      }

      strengthDiv.textContent = message;
      strengthDiv.className = 'password-strength ' + className;
      strengthDiv.style.display = 'block';
    }

    // ✅ STEP 2: Submit Reset Password
    async function submitResetPassword(event) {
      event.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const form = document.getElementById('resetPasswordForm');
      const loadingDiv = document.getElementById('loadingStep2');
      const submitBtn = document.getElementById('submitBtn');

      // Validation
      if (password.length < 6) {
        alert('Password must be at least 6 characters');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      // Show loading
      form.style.display = 'none';
      loadingDiv.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/reset-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token: resetToken,
            password,
            confirmPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          loadingDiv.style.display = 'none';
          form.style.display = 'block';
          submitBtn.disabled = false;
          
          alert(data.message || 'Error resetting password');
          return;
        }

        // Success! Show step 3
        currentStep = 3;
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');

      } catch (error) {
        loadingDiv.style.display = 'none';
        form.style.display = 'block';
        submitBtn.disabled = false;
        
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>
</html>
