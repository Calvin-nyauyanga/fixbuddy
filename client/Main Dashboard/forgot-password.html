<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - FixBuddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #1565c0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        border-radius: 5px;
      }

      .header {
        padding: 20px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>FixBuddy</h1>
        <p>Forgot Your Password?</p>
      </div>

      <div class="content">
        <div class="info-box">
          ℹ️ Enter your email address and we'll send you a link to reset your password.
        </div>

        <form id="forgotPasswordForm" onsubmit="submitForgotPassword(event)">
          <div id="messageDiv"></div>

          <div id="formContent">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input 
                type="email" 
                id="email" 
                placeholder="Enter your registered email"
                required
              >
            </div>

            <button type="submit" class="btn" id="submitBtn">Send Reset Link</button>
          </div>

          <div id="loadingDiv" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Sending reset link...</p>
          </div>
        </form>

        <div class="back-link">
          <a href="./UserLoginPage.html">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/auth';

    async function submitForgotPassword(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const form = document.getElementById('forgotPasswordForm');
      const messageDiv = document.getElementById('messageDiv');
      const formContent = document.getElementById('formContent');
      const loadingDiv = document.getElementById('loadingDiv');
      const submitBtn = document.getElementById('submitBtn');

      // Validation
      if (!email) {
        messageDiv.innerHTML = '<div class="message error">Please enter your email address</div>';
        return;
      }

      // Show loading
      formContent.style.display = 'none';
      loadingDiv.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/forgot-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          loadingDiv.style.display = 'none';
          formContent.style.display = 'block';
          submitBtn.disabled = false;
          
          messageDiv.innerHTML = `<div class="message error">${data.message || 'Error sending reset link'}</div>`;
          return;
        }

        // Success message
        loadingDiv.style.display = 'none';
        messageDiv.innerHTML = `
          <div class="message success">
            <strong>✓ Success!</strong><br>
            ${data.message}
          </div>
          <p style="text-align: center; color: #666; font-size: 13px; margin-top: 15px;">
            Check your email for the reset link. The link will expire in 24 hours.
          </p>
        `;
        form.reset();

      } catch (error) {
        loadingDiv.style.display = 'none';
        formContent.style.display = 'block';
        submitBtn.disabled = false;
        
        messageDiv.innerHTML = `<div class="message error">Error: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
